name: Update ChemRxiv metrics

on:
  workflow_dispatch:
  schedule:
    - cron: "23 8 * * *"

permissions:
  contents: write

jobs:
  update-metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependency
        run: python -m pip install requests

      - name: Fetch and validate metrics
        run: python scripts/update_metrics.py

      - name: Commit updated metrics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/chemrxiv-metrics.json
          if git diff --cached --quiet; then
            echo "No metrics changes to commit."
          else
            git commit -m "Update ChemRxiv usage metrics"
            git push
          fi
